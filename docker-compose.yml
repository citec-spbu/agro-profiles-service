
services:
  app:
    build:
      context: .
    container_name: profiles-service
    env_file:
      - .env
    ports:
      - 8001:8001
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host=0.0.0.0 --port=8001"
    depends_on:
      - db

  migrations:
    build: .
    container_name: profiles-migrations-tool
    command: sh -c "alembic upgrade head"
    depends_on:
      - db
    env_file:
      - .env

  db:
    container_name: profiles-db
    image: postgres:15
    command: postgres -c wal_level=logical
    volumes:
      - pgdbdata:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - 5435:5432

volumes:
  pgdbdata:

networks:
  default:
    external:
      name: agronetwork